<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800080" />
      <stop offset="60%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#1a0026" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.2)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.5)" />
      <stop offset="100%" stop-color="rgba(5,5,15,0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="560" fill="url(#bgGrad)" />

  <!-- Geometric / Mystic Background Patterns -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="200" cy="200" r="160" />
    <circle cx="200" cy="200" r="120" stroke-dasharray="8 6" />
    <circle cx="200" cy="200" r="70" />
    <polygon points="200,60 320,270 80,270" />
    <polygon points="200,340 320,130 80,130" />
  </g>

  <!-- Center Symbol / Icon Glow -->
  <circle cx="200" cy="200" r="60" fill="#ff4b8b" opacity="0.25" filter="url(#glow)" />
  <text x="200" y="225" font-size="70" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🥀</text>

  <!-- Dark Shade Overlay for Typography -->
  <rect width="400" height="560" fill="url(#overlay)" />

  <!-- Top Badge -->
  <g transform="translate(20, 25)">
    <rect width="140" height="28" rx="14" fill="rgba(0,0,0,0.65)" stroke="#ff4b8b" stroke-width="1.5" />
    <text x="70" y="19" font-size="11" font-weight="900" fill="#ff4b8b" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">PSYCHOLOGICAL / ROMANCE</text>
  </g>

  <!-- Audio Icon Tag -->
  <g transform="translate(340, 25)">
    <circle cx="16" cy="14" r="15" fill="rgba(0,0,0,0.65)" stroke="#00f2fe" stroke-width="1.5" />
    <text x="16" y="20" font-size="14" text-anchor="middle">🎧</text>
  </g>

  <!-- Title & Hindi Text Area -->
  <g transform="translate(20, 410)">
    <text x="0" y="0" font-size="14" font-weight="700" fill="#ff4b8b" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2">HINDI AUDIO NOVEL</text>
    <text x="0" y="30" font-size="24" font-weight="900" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" letter-spacing="1">VILLAIN MANIPULATING</text>
    <text x="0" y="58" font-size="20" font-weight="800" fill="#ffdd59" font-family="system-ui, -apple-system, sans-serif">THE HEROINES</text>
    <text x="0" y="86" font-size="16" font-weight="600" fill="#d1d8e0" font-family="'Segoe UI', 'Noto Sans Devanagari', sans-serif">✨ त्याग और नफ़रत का राज़</text>
    <line x1="0" y1="105" x2="360" y2="105" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="125" font-size="12" fill="#00f2fe" font-weight="700" font-family="system-ui, sans-serif">TELEGRAM EXCLUSIVE • DAILY EPISODES</text>
  </g>
</svg>