<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.1)" />
      <stop offset="60%" stop-color="rgba(0,0,0,0.4)" />
      <stop offset="100%" stop-color="rgba(5,5,15,0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="560" fill="url(#bgGrad)" />

  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5" fill="none">
    <circle cx="200" cy="220" r="150" />
    <circle cx="200" cy="220" r="100" stroke-dasharray="6 6" />
    <polygon points="200,90 310,280 90,280" />
  </g>

  <!-- Glowing Headphone / Audio Crest -->
  <circle cx="200" cy="220" r="65" fill="#6366f1" opacity="0.3" filter="url(#glow)" />
  <circle cx="200" cy="220" r="48" fill="rgba(15, 23, 42, 0.85)" stroke="#00f2fe" stroke-width="2" />
  <text x="200" y="235" font-size="44" text-anchor="middle" font-family="'Segoe UI Emoji', sans-serif">🎧</text>

  <rect width="400" height="560" fill="url(#overlay)" />

  <!-- Audio Novel Tag -->
  <g transform="translate(25, 25)">
    <rect width="130" height="26" rx="13" fill="rgba(0,0,0,0.6)" stroke="#00f2fe" stroke-width="1.2" />
    <text x="65" y="17" font-size="10.5" font-weight="900" fill="#00f2fe" text-anchor="middle" font-family="system-ui, sans-serif" letter-spacing="1">HINDI AUDIO</text>
  </g>

  <!-- Bottom Brand -->
  <g transform="translate(25, 470)">
    <text x="0" y="0" font-size="12" font-weight="800" fill="#818cf8" font-family="system-ui, sans-serif" letter-spacing="2">POPULAR NOVEL SERIES</text>
    <text x="0" y="24" font-size="18" font-weight="900" fill="#ffffff" font-family="system-ui, sans-serif">HINDI WEB NOVEL</text>
    <line x1="0" y1="36" x2="350" y2="36" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="52" font-size="11.5" fill="#38ef7d" font-weight="700" font-family="system-ui, sans-serif">TELEGRAM EXCLUSIVE • DAILY CHAPTERS</text>
  </g>
</svg>
